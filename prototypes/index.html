<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prototipos · Reserva de Laboratorios UNS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172a35;background:#e8edf0}
    *{box-sizing:border-box}body{margin:0}.bar{display:flex;align-items:center;gap:24px;padding:16px 24px;background:#fff;border-bottom:1px solid #d7e0e5}.brand{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}.brand span{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:9px;color:white;background:#154c56;border-radius:8px}.options{display:flex;gap:6px;flex-wrap:wrap}.option{border:1px solid transparent;background:transparent;padding:9px 13px;border-radius:9px;color:#51636e;font:600 13px inherit;cursor:pointer}.option:hover{background:#f2f5f6}.option[aria-selected=true]{color:#0d494c;background:#e4f3ef;border-color:#c4dfd7}.open{margin-left:auto;white-space:nowrap;text-decoration:none;color:#164f55;font-size:13px;font-weight:700}.caption{padding:10px 24px;color:#60717b;font-size:12px;background:#f6f8f9;border-bottom:1px solid #d7e0e5}.stage{height:calc(100dvh - 105px);padding:14px;min-height:530px}.stage iframe{display:block;width:100%;height:100%;border:1px solid #cad4da;background:white;border-radius:12px;box-shadow:0 12px 40px #203a4b16}
    @media(max-width:800px){.bar{padding:12px;gap:9px;flex-wrap:wrap}.brand{width:100%}.options{flex:1}.option{font-size:12px;padding:7px}.caption{padding:8px 12px}.stage{height:calc(100dvh - 140px);padding:7px}.open{font-size:12px}}
  </style>
</head>
<body>
  <header class="bar"><div class="brand"><span>U</span> UNS · Exploración visual</div><nav class="options" role="tablist" aria-label="Elegir prototipo"><button class="option" role="tab" aria-selected="true" data-page="01-panel-academico.html">01 · Panel académico</button><button class="option" role="tab" aria-selected="false" data-page="02-agenda-operativa.html">02 · Agenda operativa</button><button class="option" role="tab" aria-selected="false" data-page="03-catalogo-laboratorios.html">03 · Catálogo visual</button></nav><a class="open" id="open" href="01-panel-academico.html" target="_blank" rel="noopener">Abrir aparte ↗</a></header>
  <div class="caption" id="caption">Una vista equilibrada para docentes: disponibilidad, solicitudes y próximas reservas.</div>
  <main class="stage"><iframe id="preview" title="Vista previa del prototipo" src="01-panel-academico.html"></iframe></main>
  <script>
    const descriptions={"01-panel-academico.html":"Una vista equilibrada para docentes: disponibilidad, solicitudes y próximas reservas.","02-agenda-operativa.html":"Una mesa de control para administrar solicitudes, cruces de horarios y aprobaciones.","03-catalogo-laboratorios.html":"Exploración visual de espacios y reserva guiada, adaptable a pantallas pequeñas."};
    document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.option').forEach(item=>item.setAttribute('aria-selected',String(item===button)));document.querySelector('#preview').src=button.dataset.page;document.querySelector('#open').href=button.dataset.page;document.querySelector('#caption').textContent=descriptions[button.dataset.page]}));
  </script>
</body>
</html>
